<svg xmlns="http://www.w3.org/2000/svg" width="879" height="376" viewBox="0 0 879 376" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14">
<rect width="879" height="376" rx="10" fill="#10141b"/>
<rect width="879" height="34" rx="10" fill="#1a1f29"/><rect y="24" width="879" height="10" fill="#1a1f29"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="440" y="22" fill="#8b93a3" text-anchor="middle" font-size="13">dnswhy printer.local</text>
<text x="18.00" y="56.32" fill="#d5dae3" font-weight="700" xml:space="preserve">Question</text><text x="102.30" y="56.32" fill="#d5dae3" font-weight="700" xml:space="preserve">printer.local</text>

<text x="18.00" y="92.32" fill="#d5dae3" font-weight="700" xml:space="preserve">How macOS picks a resolver, in order</text>
<text x="18.00" y="110.32" fill="#d5dae3" xml:space="preserve">  1  /etc/hosts      </text><text x="195.03" y="110.32" fill="#7f8796" xml:space="preserve">no entry</text>
<text x="18.00" y="128.32" fill="#d5dae3" xml:space="preserve">  2  resolver #2  local                 </text><text x="355.20" y="128.32" fill="#a6e3a1" xml:space="preserve">MATCH</text><text x="405.78" y="128.32" fill="#d5dae3" font-weight="700" xml:space="preserve">&lt;- wins</text>
<text x="18.00" y="146.32" fill="#d5dae3" xml:space="preserve">       multicast DNS (Bonjour)   order 300000   timeout 5s</text>
<text x="77.01" y="164.32" fill="#7f8796" xml:space="preserve">claims local, a suffix of the name</text>
<text x="18.00" y="182.32" fill="#d5dae3" xml:space="preserve">  3  resolver #1  (default)             </text><text x="355.20" y="182.32" fill="#7f8796" xml:space="preserve">would answer, but a scope claims this name first</text>
<text x="18.00" y="200.32" fill="#d5dae3" xml:space="preserve">       nameserver 192.0.2.53   </text><text x="279.33" y="200.32" fill="#a6e3a1" xml:space="preserve">reachable</text>
<text x="77.01" y="218.32" fill="#7f8796" xml:space="preserve">claims no domain, so it answers whatever nothing else claimed</text>
<text x="34.86" y="236.32" fill="#7f8796" xml:space="preserve">(3 other scopes claim names this one does not end in: corp.internal,</text>
<text x="34.86" y="254.32" fill="#7f8796" xml:space="preserve">dev.corp.internal, search.only)</text>

<text x="18.00" y="290.32" fill="#d5dae3" xml:space="preserve">  Resolved by multicast DNS (Bonjour): the question is shouted on the local</text>
<text x="18.00" y="308.32" fill="#d5dae3" xml:space="preserve">  network, not asked of a nameserver. dig and nslookup always fail on these</text>
<text x="18.00" y="326.32" fill="#d5dae3" xml:space="preserve">  names; that is normal. Use  dns-sd -G v4 printer.local  to watch it work.</text>
<text x="18.00" y="344.32" fill="#a6e3a1" font-weight="700" xml:space="preserve">$</text>
</svg>
