<svg xmlns="http://www.w3.org/2000/svg" width="879" height="448" viewBox="0 0 879 448" font-family="'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14">
<rect width="879" height="448" rx="10" fill="#10141b"/>
<rect width="879" height="34" rx="10" fill="#1a1f29"/><rect y="24" width="879" height="10" fill="#1a1f29"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/><circle cx="40" cy="17" r="6" fill="#febc2e"/><circle cx="60" cy="17" r="6" fill="#28c840"/><text x="440" y="22" fill="#8b93a3" text-anchor="middle" font-size="13">dnswhy files.corp.internal</text>
<text x="18.00" y="56.32" fill="#d5dae3" font-weight="700" xml:space="preserve">Question</text><text x="102.30" y="56.32" fill="#d5dae3" font-weight="700" xml:space="preserve">files.corp.internal</text>

<text x="18.00" y="92.32" fill="#d5dae3" font-weight="700" xml:space="preserve">How macOS picks a resolver, in order</text>
<text x="18.00" y="110.32" fill="#d5dae3" xml:space="preserve">  1  /etc/hosts      </text><text x="195.03" y="110.32" fill="#7f8796" xml:space="preserve">no entry</text>
<text x="18.00" y="128.32" fill="#d5dae3" xml:space="preserve">  2  resolver #3  corp.internal         </text><text x="355.20" y="128.32" fill="#a6e3a1" xml:space="preserve">MATCH</text><text x="405.78" y="128.32" fill="#d5dae3" font-weight="700" xml:space="preserve">&lt;- wins</text>
<text x="77.01" y="146.32" fill="#7f8796" xml:space="preserve">from /etc/resolver/corp.internal</text>
<text x="18.00" y="164.32" fill="#d5dae3" xml:space="preserve">       nameserver 198.51.100.53   order 200000   timeout 5s   </text><text x="540.66" y="164.32" fill="#f7768e" xml:space="preserve">not reachable</text>
<text x="77.01" y="182.32" fill="#7f8796" xml:space="preserve">claims corp.internal, a suffix of the name</text>
<text x="18.00" y="200.32" fill="#d5dae3" xml:space="preserve">  3  resolver #1  (default)             </text><text x="355.20" y="200.32" fill="#7f8796" xml:space="preserve">would answer, but a scope claims this name first</text>
<text x="18.00" y="218.32" fill="#d5dae3" xml:space="preserve">       nameserver 192.0.2.53   </text><text x="279.33" y="218.32" fill="#a6e3a1" xml:space="preserve">reachable</text>
<text x="77.01" y="236.32" fill="#7f8796" xml:space="preserve">claims no domain, so it answers whatever nothing else claimed</text>
<text x="34.86" y="254.32" fill="#7f8796" xml:space="preserve">(3 other scope(s) claim names this one does not end in: dev.corp.internal,</text>
<text x="34.86" y="272.32" fill="#7f8796" xml:space="preserve">search.only, and 1 Bonjour scopes)</text>

<text x="18.00" y="308.32" fill="#d5dae3" xml:space="preserve">  files.corp.internal is answered by the corp.internal scope, which dig knows nothing about:</text>
<text x="18.00" y="326.32" fill="#d5dae3" xml:space="preserve">  dig reads /etc/resolv.conf and would ask 192.0.2.53. To ask what your</text>
<text x="18.00" y="344.32" fill="#d5dae3" xml:space="preserve">  applications ask, name the server yourself:  dig @198.51.100.53 files.corp.internal</text>
<text x="18.00" y="362.32" fill="#d5dae3" xml:space="preserve">  The corp.internal scope is marked not reachable, so this name fails while the</text>
<text x="18.00" y="380.32" fill="#d5dae3" xml:space="preserve">  connection that provides it (a VPN, a container, a local dnsmasq) is down -</text>
<text x="18.00" y="398.32" fill="#d5dae3" xml:space="preserve">  it does not fall back to the default nameservers.</text>
<text x="18.00" y="416.32" fill="#a6e3a1" font-weight="700" xml:space="preserve">$</text>
</svg>
